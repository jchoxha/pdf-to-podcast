<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF to Podcast</title>
<meta name="description" content="Turn textbook chapters into conversational study podcasts, free, in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233d5afe'/%3E%3Cpath d='M16 7a4 4 0 0 1 4 4v5a4 4 0 0 1-8 0v-5a4 4 0 0 1 4-4zm-7 9h2a5 5 0 0 0 10 0h2a7 7 0 0 1-6 6.9V26h-2v-3.1A7 7 0 0 1 9 16z' fill='white'/%3E%3C/svg%3E">
<script>
  // Multithreaded voice rendering needs cross-origin isolation; GitHub Pages can't set headers, so a tiny service worker adds them.
  window.coi = { shouldRegister: () => { try { return localStorage.getItem('pdfpod.threads') !== 'off'; } catch { return true; } }, quiet: true };
</script>
<script src="coi-serviceworker.js"></script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo" aria-hidden="true"></span><span>PDF to Podcast</span></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="create" class="active">Create</button>
    <button role="tab" data-tab="library">Library</button>
    <button role="tab" data-tab="usage">Usage</button>
    <button role="tab" data-tab="settings">Settings</button>
  </nav>
</header>
<main id="app">
  <section id="tab-create" class="tab-panel active"></section>
  <section id="tab-library" class="tab-panel"></section>
  <section id="tab-usage" class="tab-panel"></section>
  <section id="tab-settings" class="tab-panel"></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>This app needs JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
